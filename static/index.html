<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게임 개발 AI 튜터</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <span class="logo">🎮</span>
        <div>
          <h1>게임 개발 AI 튜터</h1>
          <p class="subtitle">pygame으로 게임 만들기 — 무엇이든 물어보세요</p>
        </div>
      </div>
      <div class="header-right">
        <span id="status" class="status status-checking">● 연결 확인 중</span>
        <button id="homeBtn" class="reset-btn" title="홈으로">🏠 홈</button>
        <button id="resetBtn" class="reset-btn" title="새 대화">새 대화</button>
      </div>
    </header>

    <!-- 메시지 영역 -->
    <main id="messages" class="messages">
      <div class="welcome">
        <div class="welcome-icon">🚀</div>
        <h2>안녕하세요! 게임 개발을 도와드릴게요</h2>
        <p>아래 메뉴를 누르면 예시 질문을 보여드려요. 예시를 참고해서 직접 질문해 보세요.</p>
        <div class="quick-buttons">
          <button class="quick-btn" data-menu="idea">💡 게임 아이디어 추천</button>
          <button class="quick-btn" data-menu="structure">🧱 게임 기본 구조 설계하기</button>
        </div>
      </div>
    </main>

    <!-- 입력 영역 -->
    <footer class="input-area">
      <div class="input-box">
        <textarea id="input" placeholder="질문을 입력하세요. (예: 캐릭터가 점프하게 만들어줘)" rows="1"></textarea>
        <button id="sendBtn" class="send-btn" title="보내기">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
      <p class="hint">💬 AI가 만든 코드는 직접 실행해보고, 안 되면 오류 메시지를 그대로 붙여넣어 주세요.</p>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
